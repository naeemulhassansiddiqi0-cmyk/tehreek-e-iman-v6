<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحریک ایمان - نماز کے اوقات</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;--accent2:#a78bfa;--green:#34d399;--gold:#fbbf24;--r:18px;--sh:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{font-family:'Noto Nastaliq Urdu',serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0;direction:rtl}
.wrap{max-width:680px;margin:0 auto;padding:16px;padding-bottom:40px}
header{background:var(--card);padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:var(--r);margin-bottom:16px}
header img{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex-shrink:0}
.header-text{text-align:right}
.header-text h1{font-size:clamp(22px,4vw,30px);color:var(--gold);line-height:1.3;margin:0}
.header-text .sub{font-size:clamp(13px,2vw,16px);color:var(--muted);margin-top:8px}
.header-text .name{font-size:clamp(12px,2vw,14px);color:var(--gold);margin-top:4px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
.card-label{font-size:12px;color:var(--muted);text-align:right;margin-bottom:8px}
#citySelect,input{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;font-family:inherit;direction:rtl;background:var(--card);color:var(--text);border:1px solid var(--accent2)}
button{padding:12px 14px;font-size:16px;border-radius:12px;font-family:inherit;border:0;cursor:pointer;font-weight:700}
button.add-btn{width:100%;background:var(--accent2);margin-top:8px}
.row{display:flex;gap:8px}
.row input{flex:1}
.row button.add-btn{width:auto;flex:0 0 80px;background:var(--green);margin-top:0}
.box{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px dashed rgba(255,255,255,.1);gap:8px}
.box:last-child{border-bottom:0}
.name{font-weight:700;flex:1;text-align:right}
.name.clickable{cursor:pointer;text-decoration:underline dotted var(--gold);text-underline-offset:4px}
.name.clickable:active{opacity:.7}
.time{opacity:.9;min-width:90px;text-align:left}
.btns{display:flex;gap:6px}
.alarm-btn{width:auto;padding:6px 12px;font-size:13px;background:var(--accent);border-radius:8px;margin:0;color:#000}
.azan-btn{width:auto;padding:6px 12px;font-size:13px;background:var(--gold);color:#000;border-radius:8px;margin:0}
.azan-btn.active{background:#ef4444;color:#fff}
.custom{color:var(--green)}

/* ===== نماز کا طریقہ پاپ اپ ===== */
.ti-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.ti-overlay.active{display:flex}
.ti-modal{background:var(--card);border-radius:var(--r);max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--sh);font-family:inherit}
.ti-modal-header{background:linear-gradient(135deg,var(--card),#0f172a);border-bottom:2px solid var(--gold);color:var(--gold);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:var(--r) var(--r) 0 0;position:sticky;top:0;z-index:2}
.ti-modal-header h2{margin:0;font-size:20px}
.ti-close{background:none;border:none;color:var(--gold);font-size:26px;cursor:pointer;line-height:1}
.ti-modal-body{padding:14px 18px 22px}
.ti-rakat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.ti-rakat-item{background:rgba(167,139,250,.08);border:1px solid var(--accent2);border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .2s}
.ti-rakat-item:active{background:rgba(167,139,250,.2)}
.ti-rakat-item .row2{display:flex;justify-content:space-between;align-items:center}
.ti-rakat-item .label{font-weight:700;font-size:17px;color:var(--gold)}
.ti-rakat-item .count{background:var(--accent2);color:#0f172a;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:700}
.ti-rakat-item .note{color:var(--muted);font-size:13px;margin-top:4px}
.ti-back-btn{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;margin-bottom:12px;padding:0}
.ti-steps{list-style:none;margin:0;padding:0;counter-reset:step}
.ti-steps li{counter-increment:step;margin-bottom:12px;padding-right:38px;position:relative;line-height:1.7;font-size:15px}
.ti-steps li::before{content:counter(step);position:absolute;right:0;top:0;background:var(--gold);color:#0f172a;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ti-step-title{background:rgba(251,191,36,.12);border:1px solid var(--gold);color:var(--gold);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:15px;font-weight:700}
.ti-disclaimer{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px dashed rgba(255,255,255,.15);padding-top:10px}
.ti-hadith{background:rgba(52,211,153,.08);border-right:3px solid var(--green);border-radius:8px;padding:10px 12px;margin-top:8px}
.ti-hadith .ar{font-family:'Traditional Arabic','Scheherazade New',serif;font-size:19px;color:var(--gold);line-height:2;text-align:center;direction:rtl}
.ti-hadith .tr{font-size:13px;color:var(--text);margin-top:6px;line-height:1.6}
.ti-hadith .ref{font-size:11px;color:var(--green);margin-top:6px;font-weight:700}
.ti-hadith.unverified{border-right-color:#f87171;background:rgba(248,113,113,.08)}
.ti-hadith.unverified .ref{color:#f87171}
.ti-fiqh-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;background:rgba(167,139,250,.06);padding:8px 10px;border-radius:8px}
</style>
</head>

    <div class="ti-modal-header">

<script>
const to12=x=>{const[h,m]=x.split(':');const H=+h;return`${H%12||12}:${m} ${H>=12?'PM':'AM'}`};
const addMins=(time,mins)=>{let[h,m]=time.split(':').map(Number);let d=new Date();d.setHours(h,m+mins);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
let allTimes=[];
const azan=document.getElementById('azanAudio');
let isAzanPlaying=false;

Notification.requestPermission();

function speak(text){
if('speechSynthesis' in window){
const u=new SpeechSynthesisUtterance(text);
u.lang='ur-PK';
speechSynthesis.speak(u);
}
if(Notification.permission==='granted'){
new Notification('نماز کا وقت', {body:text});
}
}

function playAzan(btn){
if(isAzanPlaying){
azan.pause();
azan.currentTime=0;
btn.classList.remove('active');
btn.innerHTML='🔈 ازان';
isAzanPlaying=false;
}else{
azan.currentTime=0; 
azan.play().then(()=>{
btn.classList.add('active');
btn.innerHTML='⏹️ بند کریں';
isAzanPlaying=true;
}).catch(e=>alert('پہلے سکرین کو 1 بار Touch کریں پھر ازان دبائیں'));
}
azan.onended=()=>{
document.querySelectorAll('.azan-btn').forEach(b=>{
b.classList.remove('active');
b.innerHTML='🔈 ازان';
});
isAzanPlaying=false;
}
}

function checkAlarms(){
const now=new Date();
const current=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
allTimes.forEach(t=>{
if(t.time===current && !t.rang){
speak(`${t.name} کا وقت ہو گیا ہے`);
const btn=document.querySelector('.azan-btn');
if(btn) playAzan(btn);
t.rang=true;
}
});
}

function setAlarm(name,time){
if(Notification.permission!=='granted'){Notification.requestPermission();}
const [h,m]=time.split(':');
const alarmTime=new Date();
alarmTime.setHours(+h,m,0,0);
if(alarmTime<new Date())alarmTime.setDate(alarmTime.getDate()+1);
const diff=alarmTime-new Date();
setTimeout(()=>{speak(`${name} کا وقت ہو گیا ہے`); const btn=document.querySelector('.azan-btn'); if(btn) playAzan(btn);},diff);
alert(`${name} کا Alarm ${to12(time)} پر سیٹ ہو گیا`);
}

function getMethodSteps(rakatInfo){
  const isWitr = rakatInfo.label === "وتر";
  const rakatCount = parseInt(rakatInfo.count);

const tiOverlay = document.getElementById('tiOverlay');
const tiModalTitle = document.getElementById('tiModalTitle');
const tiModalBody = document.getElementById('tiModalBody');
document.getElementById('tiCloseBtn').addEventListener('click', closeTiModal);
tiOverlay.addEventListener('click', e => { if (e.target === tiOverlay) closeTiModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTiModal(); });

function closeTiModal(){ tiOverlay.classList.remove('active'); }

function openNamazPopup(key){
  const data = namazData[key];
  if(!data) return;
  renderRakatList(key, data);
  tiOverlay.classList.add('active');
}

function renderHadithBlock(h){
  if(!h) return '';
  let html = '';
  if(h.arabic){
    html += `<div class="ti-hadith${h.verified ? '' : ' unverified'}">
      <div class="ar">${h.arabic}</div>
      <div class="tr">${h.urdu}</div>
      <div class="ref">${h.verified ? '✓ ' : '⚠ '}${h.ref}</div>
    </div>`;
  }
  if(h.fiqhNote){
    html += `<div class="ti-fiqh-note">${h.unverified ? '⚠ ' : ''}${h.fiqhNote}</div>`;
  }
  return html;
}

function renderRakatList(key, data){
  tiModalTitle.textContent = data.title;
  let html = `<div class="ti-rakat-list">`;
  data.rakats.forEach((r, idx) => {
    html += `<div class="ti-rakat-item" data-idx="${idx}">
      <div class="row2"><span class="label">${r.label}</span><span class="count">${r.count}</span></div>
      <div class="note">${r.note}</div>
      ${renderHadithBlock(r.hadith)}
    </div>`;
  });
  html += `</div><div class="ti-disclaimer">یہ ترتیب فقہ حنفی کے مطابق ہے۔ ✓ = تصدیق شدہ حدیث حوالہ۔ ⚠ = عمومی فقہی نوٹ، جس کے لیے مخصوص حدیث نمبر یہاں تصدیق شدہ نہیں۔ کسی بھی رکعت پر کلک کر کے نماز پڑھنے کا مکمل طریقہ دیکھیں۔</div>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelectorAll('.ti-rakat-item').forEach(item => {
    item.addEventListener('click', () => renderMethod(key, data, parseInt(item.dataset.idx)));
  });
}

function renderMethod(key, data, idx){
  const rakatInfo = data.rakats[idx];
  const steps = getMethodSteps(rakatInfo);
  tiModalTitle.textContent = `${data.title} — ${rakatInfo.label}`;
  let html = `<button class="ti-back-btn">&#8594; واپس تمام نمازیں دیکھیں</button>`;
  html += renderHadithBlock(rakatInfo.hadith);
  html += `<div class="ti-step-title">${rakatInfo.label} (${rakatInfo.count}) پڑھنے کا طریقہ</div>`;
  html += `<ol class="ti-steps">`;
  steps.forEach(s => html += `<li>${s}</li>`);
  html += `</ol>`;
  html += `<div class="ti-disclaimer">نوٹ: یہ عمومی مسنون طریقہ ہے۔ تفصیلی احادیث اور مکمل حوالہ جات کے لیے مستند فقہی کتب یا اپنے مقامی عالم سے رجوع کریں۔</div>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelector('.ti-back-btn').addEventListener('click', () => renderRakatList(key, data));
}
