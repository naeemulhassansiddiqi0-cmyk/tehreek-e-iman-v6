<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحریک ایمان - نماز کے اوقات</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;--accent2:#a78bfa;--green:#34d399;--gold:#fbbf24;--r:18px;--sh:0 10px 30px rgba(0,0,0,.25)}
@font-face{font-family:'Jameel Noori Nastaleeq';src:url('https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff') format('woff');font-display:swap}
*{box-sizing:border-box}
body{font-family:'Noto Nastaliq Urdu',serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0;direction:rtl}
.wrap{max-width:680px;margin:0 auto;padding:16px;padding-bottom:40px}
header{background:var(--card);padding:16px 18px;border-radius:var(--r);margin-bottom:16px}
.header-top{display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:12px;border-bottom:1px dashed rgba(255,255,255,.12)}
header img{width:140px;height:140px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;flex-shrink:0}
.header-title{text-align:right}
.header-title h1{font-size:clamp(20px,3.6vw,26px);color:var(--gold);line-height:1.3;margin:0}
.header-title .sub{font-size:clamp(26px,5vw,36px);color:var(--gold);margin-top:10px;font-weight:800;line-height:1.4}
.header-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;flex-wrap:wrap}
.header-right{text-align:right}
.header-right .name{font-size:clamp(12px,2vw,14px);color:var(--gold);font-weight:700;margin:0}
.header-left{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:150px}
.live-clock{font-size:15px;font-weight:700;color:var(--accent);direction:ltr;letter-spacing:.5px}
.countdown-box{background:rgba(52,211,153,.1);border:1px solid var(--green);border-radius:10px;padding:5px 10px;text-align:center;direction:rtl}
.countdown-label{font-size:11px;color:var(--muted)}
.countdown-timer{font-size:16px;font-weight:700;color:var(--green);direction:ltr}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
.card-label{font-size:12px;color:var(--muted);text-align:right;margin-bottom:8px}
#citySelect,input{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;font-family:inherit;direction:rtl;background:var(--card);color:var(--text);border:1px solid var(--accent2)}
button{padding:12px 14px;font-size:16px;border-radius:12px;font-family:inherit;border:0;cursor:pointer;font-weight:700}
button.add-btn{width:100%;background:var(--accent2);margin-top:8px}
.row{display:flex;gap:8px}
.row input{flex:1}
.row button.add-btn{width:auto;flex:0 0 80px;background:var(--green);margin-top:0}
.box{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px dashed rgba(255,255,255,.1);gap:8px}
.box:last-child{border-bottom:0}
.name{font-weight:700;flex:1;text-align:right}
.name.clickable{cursor:pointer;text-decoration:underline dotted var(--gold);text-underline-offset:4px}
.name.clickable:active{opacity:.7}
.time{opacity:.9;min-width:90px;text-align:left}
.btns{display:flex;gap:6px}
.alarm-btn{width:auto;padding:6px 12px;font-size:13px;background:var(--accent);border-radius:8px;margin:0;color:#000}
.azan-btn{width:auto;padding:6px 12px;font-size:13px;background:var(--gold);color:#000;border-radius:8px;margin:0}
.azan-btn.active{background:#ef4444;color:#fff}
.custom{color:var(--green)}

/* ===== نماز/عمل کا طریقہ پاپ اپ ===== */
.ti-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;backdrop-filter:blur(2px)}
.ti-overlay.active{display:flex}
.ti-modal{background:var(--card);border-radius:var(--r);max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--sh);font-family:'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif}
.ti-modal-header{background:linear-gradient(135deg,#243247,#0f172a);border-bottom:2px solid var(--gold);color:var(--gold);padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-radius:var(--r) var(--r) 0 0;position:sticky;top:0;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.ti-header-row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ti-header-row1 h2{margin:0;font-size:20px;flex:1;line-height:1.4}
.ti-header-row2{display:flex;align-items:center;gap:8px}
.ti-voice-select{flex:1;background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:7px 10px;font-size:12px;font-family:inherit;direction:ltr;text-align:left;max-width:220px}
.ti-listen-btn{background:linear-gradient(135deg,var(--green),#16a34a);color:#06210f;border:none;font-size:13px;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(52,211,153,.35);transition:transform .15s,box-shadow .15s;white-space:nowrap;flex-shrink:0}
.ti-listen-btn:active{transform:scale(.95)}
.ti-listen-btn.active{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 3px 10px rgba(239,68,68,.4)}
.ti-close{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--gold);font-size:20px;width:34px;height:34px;border-radius:50%;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.ti-close:active{background:rgba(251,191,36,.3)}
.ti-modal-body{padding:16px 18px 22px;font-size:17px;line-height:2}
.ti-rakat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.ti-rakat-item{background:rgba(167,139,250,.1);border:1px solid var(--accent2);border-radius:12px;padding:13px 15px;cursor:pointer;transition:background .2s,transform .15s}
.ti-rakat-item:active{background:rgba(167,139,250,.22);transform:scale(.99)}
.ti-rakat-item .row2{display:flex;justify-content:space-between;align-items:center}
.ti-rakat-item .label{font-weight:700;font-size:19px;color:var(--gold)}
.ti-rakat-item .count{background:var(--accent2);color:#0f172a;padding:3px 12px;border-radius:20px;font-size:14px;font-weight:800}
.ti-rakat-item .note{color:#cbd5e1;font-size:14.5px;margin-top:5px;line-height:1.8}
.ti-back-btn{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;padding:8px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;transition:background .15s}
.ti-back-btn:active{background:rgba(34,211,238,.25)}
.ti-steps{list-style:none;margin:0;padding:0;counter-reset:step}
.ti-steps li{counter-increment:step;margin-bottom:14px;padding-right:40px;position:relative;line-height:1.9;font-size:17px;color:#f8fafc}
.ti-steps li::before{content:counter(step);position:absolute;right:0;top:0;background:var(--gold);color:#0f172a;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-shadow:0 2px 6px rgba(251,191,36,.4)}
.ti-step-title{background:rgba(251,191,36,.15);border:1px solid var(--gold);color:var(--gold);padding:11px 15px;border-radius:10px;margin-bottom:14px;font-size:17px;font-weight:800}
.ti-disclaimer{margin-top:16px;font-size:13px;color:#cbd5e1;border-top:1px dashed rgba(255,255,255,.15);padding-top:10px;line-height:1.8}
.ti-hadith{background:rgba(52,211,153,.1);border-right:3px solid var(--green);border-radius:8px;padding:12px 14px;margin-top:8px;margin-bottom:14px}
.ti-hadith .ar{font-family:'Traditional Arabic','Scheherazade New',serif;font-size:21px;color:var(--gold);line-height:2.1;text-align:center;direction:rtl}
.ti-hadith .tr{font-size:16px;color:#ffffff;margin-top:8px;line-height:1.9;font-weight:500}
.ti-hadith .ref{font-size:13px;color:var(--green);margin-top:8px;font-weight:800}
.ti-hadith.unverified{border-right-color:#f87171;background:rgba(248,113,113,.1)}
.ti-hadith.unverified .ref{color:#f87171}
.ti-fiqh-note{font-size:14px;color:#e2e8f0;margin-top:6px;line-height:1.8;background:rgba(167,139,250,.1);padding:10px 12px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="header-top">
    <img src="logo.png" alt="logo">
    <div class="header-title">
      <h1>تحریک ایمان</h1>
      <p class="sub">روزانہ نماز کے اوقات</p>
    </div>
  </div>
  <div class="header-bottom">
    <div class="header-right">
      <p class="name">محمد نعیم الحسن صدیقی</p>
    </div>
    <div class="header-left">
      <div class="live-clock" id="liveClock">--:--:-- PST</div>
      <div class="countdown-box">
        <div class="countdown-label" id="countdownLabel">اگلی نماز</div>
        <div class="countdown-timer" id="countdownTimer">--:--:--</div>
      </div>
    </div>
  </div>
</header>

<div class="card">
<div class="card-label">شہر منتخب کریں</div>
<select id="citySelect">
<option value="Karachi">کراچی</option>
<option value="Lahore">لاہور</option>
<option value="Islamabad">اسلام آباد</option>
<option value="Peshawar">پشاور</option>
<option value="Quetta">کوئٹہ</option>
<option value="Multan">ملتان</option>
<option value="Faisalabad">فیصل آباد</option>
<option value="Rawalpindi">راولپنڈی</option>
<option value="Sialkot">سیالکوٹ</option>
<option value="Bahawalpur">بہاولپور</option>
<option value="Sargodha">سرگودھا</option>
<option value="Gujranwala">گوجرانوالہ</option>
<option value="Hyderabad">حیدرآباد</option>
<option value="Sukkur">سکھر</option>
<option value="Abbottabad">ایبٹ آباد</option>
</select>
</div>

<div class="card">
<div class="card-label">اپنا ٹائم Add کریں</div>
<div class="row">
<input id="customName" placeholder="نام لکھیں: جیسے تہجد">
<input id="customTime" type="time">
<button class="add-btn" onclick="addCustom()">Add</button>
</div>
</div>

<div class="card" id="times"></div>
</div>

<audio id="azanAudio" src="azan.mp3" preload="auto" playsinline></audio>
<audio id="ttsAudio" preload="none" playsinline></audio>

<!-- ===== نماز/عمل کا طریقہ پاپ اپ (مودل) ===== -->
<div class="ti-overlay" id="tiOverlay">
  <div class="ti-modal">
    <div class="ti-modal-header">
      <div class="ti-header-row1">
        <h2 id="tiModalTitle">نماز کا طریقہ</h2>
        <button class="ti-close" id="tiCloseBtn" aria-label="بند کریں">&times;</button>
      </div>
      <div class="ti-header-row2">
        <select id="voiceSelect" class="ti-voice-select" onchange="onVoiceSelectChange()" title="آواز منتخب کریں"></select>
        <button class="ti-listen-btn" id="tiListenBtn" onclick="toggleListen()">🔊 سنیں</button>
      </div>
    </div>
    <div class="ti-modal-body" id="tiModalBody"></div>
  </div>
</div>

<script>
const to12=x=>{const[h,m]=x.split(':');const H=+h;return`${H%12||12}:${m} ${H>=12?'PM':'AM'}`};
const addMins=(time,mins)=>{let[h,m]=time.split(':').map(Number);let d=new Date();d.setHours(h,m+mins);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const timeToMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const minToTime=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=Math.round(m%60);return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`};
// تہجد کا وقت = رات کے آخری تہائی حصے کا آغاز (عشاء سے فجر کے درمیانی وقفے کی بنیاد پر)
function computeTahajjud(ishaTime,fajrTime){
  let isha=timeToMin(ishaTime), fajr=timeToMin(fajrTime);
  if(fajr<=isha) fajr+=1440;
  const duration=fajr-isha;
  const lastThirdStart=fajr-duration/3;
  return minToTime(lastThirdStart);
}

let allTimes=[];
let nextPrayerCache=null;
const azan=document.getElementById('azanAudio');
let isAzanPlaying=false;

Notification.requestPermission();

/* ===================== آواز کا انتخاب (Urdu TTS) — خودکار + دستی ===================== */
let selectedVoice = null;
let allVoicesList = [];

function pickSeriousMaleVoice(voices){
  let v = voices.find(x => /ur/i.test(x.lang) && /male/i.test(x.name));
  if(!v) v = voices.find(x => /ur-PK|ur-IN|ur_PK|ur_IN/i.test(x.lang));
  if(!v) v = voices.find(x => /^ur/i.test(x.lang));
  if(!v) v = voices.find(x => /hi-IN/i.test(x.lang) && /male/i.test(x.name));
  if(!v) v = voices.find(x => /hi-IN/i.test(x.lang) && !/female/i.test(x.name));
  if(!v) v = voices.find(x => /hi-IN/i.test(x.lang));
  if(!v) v = voices.find(x => /ar/i.test(x.lang) && /male/i.test(x.name));
  if(!v) v = voices.find(x => /male/i.test(x.name) && !/female/i.test(x.name));
  return v || (voices.length ? voices[0] : null);
}

function populateVoiceList(){
  allVoicesList = speechSynthesis.getVoices();
  if(!allVoicesList.length) return;
  const sel = document.getElementById('voiceSelect');
  const savedName = localStorage.getItem('ti_voice_name');
  let toUse = null;
  if(sel){
    sel.innerHTML = '';
    // اردو/ہندی/عربی آوازیں اوپر، باقی نیچے
    const priority = allVoicesList.filter(v=>/^ur|hi-IN|^ar/i.test(v.lang));
    const others = allVoicesList.filter(v=>!/^ur|hi-IN|^ar/i.test(v.lang));
    [...priority, ...others].forEach(v=>{
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      sel.appendChild(opt);
    });
    if(savedName && allVoicesList.some(v=>v.name===savedName)){
      sel.value = savedName;
      toUse = allVoicesList.find(v=>v.name===savedName);
    }else{
      toUse = pickSeriousMaleVoice(allVoicesList);
      if(toUse) sel.value = toUse.name;
    }
  }else{
    toUse = pickSeriousMaleVoice(allVoicesList);
  }
  selectedVoice = toUse;
}

function onVoiceSelectChange(){
  const sel = document.getElementById('voiceSelect');
  if(!sel) return;
  const v = allVoicesList.find(x=>x.name===sel.value);
  if(v){
    selectedVoice = v;
    localStorage.setItem('ti_voice_name', v.name);
    // منتخب آواز کا فوری نمونہ سنائیں
    speechSynthesis.cancel();
    const test = new SpeechSynthesisUtterance('السلام علیکم، یہ آپ کی منتخب کردہ آواز ہے');
    applyVoiceSettings(test);
    speechSynthesis.speak(test);
  }
}

speechSynthesis.onvoiceschanged = populateVoiceList;
populateVoiceList();

function applyVoiceSettings(u){
  if(selectedVoice) u.voice = selectedVoice;
  u.lang = (selectedVoice && selectedVoice.lang) ? selectedVoice.lang : 'ur-PK';
  u.pitch = 0.82;   // سنجیدہ، بھاری لہجہ
  u.rate = 0.88;    // صاف اور ٹھہر ٹھہر کر
  u.volume = 1;
}

let arabicVoice = null;
function pickArabicVoice(voices){
  let v = voices.find(x => /^ar/i.test(x.lang) && /male/i.test(x.name));
  if(!v) v = voices.find(x => /^ar/i.test(x.lang));
  return v || null;
}

function speak(text){
if('speechSynthesis' in window){
const u=new SpeechSynthesisUtterance(text);
applyVoiceSettings(u);
speechSynthesis.speak(u);
}
if(Notification.permission==='granted'){
new Notification('نماز کا وقت', {body:text});
}
}

function playAzan(btn){
if(isAzanPlaying){
azan.pause();
azan.currentTime=0;
btn.classList.remove('active');
btn.innerHTML='🔈 ازان';
isAzanPlaying=false;
}else{
azan.currentTime=0; 
azan.play().then(()=>{
btn.classList.add('active');
btn.innerHTML='⏹️ بند کریں';
isAzanPlaying=true;
}).catch(e=>alert('پہلے سکرین کو 1 بار Touch کریں پھر ازان دبائیں'));
}
azan.onended=()=>{
document.querySelectorAll('.azan-btn').forEach(b=>{
b.classList.remove('active');
b.innerHTML='🔈 ازان';
});
isAzanPlaying=false;
}
}

function checkAlarms(){
const now=new Date();
const current=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
allTimes.forEach(t=>{
if(t.time===current && !t.rang){
speak(`${t.name} کا وقت ہو گیا ہے`);
const btn=document.querySelector('.azan-btn');
if(btn) playAzan(btn);
t.rang=true;
}
});
}

function setAlarm(name,time){
if(Notification.permission!=='granted'){Notification.requestPermission();}
const [h,m]=time.split(':');
const alarmTime=new Date();
alarmTime.setHours(+h,m,0,0);
if(alarmTime<new Date())alarmTime.setDate(alarmTime.getDate()+1);
const diff=alarmTime-new Date();
setTimeout(()=>{speak(`${name} کا وقت ہو گیا ہے`); const btn=document.querySelector('.azan-btn'); if(btn) playAzan(btn);},diff);
alert(`${name} کا Alarm ${to12(time)} پر سیٹ ہو گیا`);
}

/* ===================== لائیو گھڑی (پاکستان اسٹینڈرڈ ٹائم) اور کاؤنٹ ڈاؤن ===================== */
function getNextPrayerTarget(){
  const mainNames=['فجر','ظہر','عصر','مغرب','عشاء'];
  const mainPrayers=allTimes.filter(t=>mainNames.includes(t.name));
  if(!mainPrayers.length) return null;
  const pktNow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
  let best=null;
  mainPrayers.forEach(t=>{
    const [h,m]=t.time.split(':').map(Number);
    let target=new Date(pktNow);
    target.setHours(h,m,0,0);
    if(target<=pktNow) target.setDate(target.getDate()+1);
    if(!best || target<best.target) best={target,name:t.name};
  });
  return best;
}

function updateClockAndCountdown(){
  const pktStr=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Karachi',hour12:true,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const clockEl=document.getElementById('liveClock');
  if(clockEl) clockEl.textContent=pktStr+' PST';

  const labelEl=document.getElementById('countdownLabel');
  const timerEl=document.getElementById('countdownTimer');
  if(!nextPrayerCache){ if(timerEl) timerEl.textContent='--:--:--'; return; }

  const pktNow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
  let diff=nextPrayerCache.target-pktNow;
  if(diff<=0){ nextPrayerCache=getNextPrayerTarget(); if(!nextPrayerCache){ if(timerEl) timerEl.textContent='--:--:--'; return;} diff=nextPrayerCache.target-pktNow; }

  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if(labelEl) labelEl.textContent=`${nextPrayerCache.name} میں`;
  if(timerEl) timerEl.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ===================== نماز/عمل کے طریقے کا ڈیٹا اور پاپ اپ لاجک ===================== */
const namazData = {
  fajar: { title: "نمازِ فجر", audio: "audio/fajar.mp3", rakats: [
    { label: "سنتِ مؤکدہ", count: "2 رکعت", note: "فرض سے پہلے — نہایت تاکیدی سنت، اسے کبھی نہ چھوڑیں",

  const isWitr = rakatInfo.label === "وتر";

  const opening = [

  ];
  const rukuSajdaFirst = [
    `«${ARB.takbeer.ar}» کہہ کر رکوع میں جائیں اور تین بار پڑھیں: ${fmt(ARB.rukuTasbeeh)}`,
    `سیدھے کھڑے ہوتے ہوئے کہیں: ${fmt(ARB.samiAllah)}`,
    `«${ARB.takbeer.ar}» کہہ کر سجدے میں جائیں، تین بار پڑھیں: ${fmt(ARB.sajdaTasbeeh)}، پھر «${ARB.takbeer.ar}» کہہ کر تھوڑی دیر بیٹھیں، دوبارہ «${ARB.takbeer.ar}» کہہ کر دوسرا سجدہ کریں — پہلی رکعت مکمل`
  ];
  const secondRakat = [
    `«${ARB.takbeer.ar}» کہہ کر کھڑے ہو جائیں، دوسری رکعت میں دوبارہ تسمیہ پڑھیں: ${fmt(ARB.tasmia)}، پھر سورۃ الفاتحہ اور کوئی سورت پڑھ کر اسی طرح رکوع و سجدہ کریں`
  ];
  const closingWithSalam = [
    `آخری قعدہ میں بیٹھ کر تشہد پڑھیں: ${fmt(ARB.tashahhud)}`,
    `درودِ ابراہیمی پڑھیں: ${fmt(ARB.durood)}`,

    ...opening,
    ...rukuSajdaFirst,
    ...secondRakat,
    `دوسری رکعت کے سجدوں کے بعد قعدہ میں بیٹھ کر صرف تشہد پڑھیں ${fmt(ARB.tashahhud)} (درود نہیں)، پھر «${ARB.takbeer.ar}» کہے بغیر سیدھے تیسری رکعت کے لیے کھڑے ہو جائیں`,
    `تیسری رکعت میں تسمیہ، سورۃ الفاتحہ اور کوئی سورت پڑھنے کے بعد، رکوع سے پہلے «${ARB.takbeer.ar}» کہہ کر دوبارہ ہاتھ باندھیں اور دعائے قنوت پڑھیں: ${fmt(ARB.quNoot)}`,
    `دعائے قنوت کے بعد «${ARB.takbeer.ar}» کہہ کر رکوع میں جائیں (تین بار «${ARB.rukuTasbeeh.ar}»)، پھر سجدہ کریں (تین بار «${ARB.sajdaTasbeeh.ar}»)`,
    ...closingWithSalam
  ];

  if (rakatCount >= 4) return [
    ...opening,
    ...rukuSajdaFirst,
    ...secondRakat,
    `دوسری رکعت کے سجدوں کے بعد قعدہ اولیٰ میں بیٹھ کر صرف تشہد پڑھیں: ${fmt(ARB.tashahhud)} (درود نہیں پڑھنا)، پھر «${ARB.takbeer.ar}» کہہ کر تیسری رکعت کے لیے کھڑے ہوں`,
    `تیسری اور چوتھی رکعت میں صرف سورۃ الفاتحہ پڑھیں: ${fmt(ARB.fatiha)} (سورت ملانا ضروری نہیں) اور اسی طرح رکوع و سجدہ کریں`,
    ...closingWithSalam,
    `نوٹ: اگر یہ نماز نفل کی طرح دو دو رکعت کر کے پڑھنی ہو تو ہر دو رکعت مکمل کر کے سلام پھیر دیں اور نئی نیت سے دوبارہ اوپر سے شروع کریں`
  ];

  return [
    ...opening,
    ...rukuSajdaFirst,
    ...secondRakat.map(s=>s.replace('اسی طرح رکوع و سجدہ کریں','اسی طرح رکوع و سجدہ کر کے دوسری رکعت مکمل کریں')),
    ...closingWithSalam
  ];
}

/* ===================== فضائل و طریقہ سننے کی سہولت (ریکارڈ شدہ آڈیو + TTS فال بیک) ===================== */
let currentSpeechChunks = [];
let currentAudioUrl = null;
let speechQueueIndex = 0;
let speechWatchdog = null;
const ttsAudioEl = document.getElementById('ttsAudio');

// «...» میں لپٹا متن خالص عربی سمجھا جائے گا، باقی اردو — یہ طریقہ زیادہ قابلِ اعتماد ہے
// کیونکہ اردو اور عربی رسم الخط ایک ہی یونیکوڈ رینج میں ہیں، محض حروف گن کر فرق نہیں کیا جا سکتا
function parseSpeechSegments(text){
  const out = [];
  const re = /«([^»]+)»/g;
  let lastIndex = 0, m;
  while((m = re.exec(text)) !== null){
    const before = text.slice(lastIndex, m.index).trim();
    if(before) splitUrduSentences(before).forEach(s => out.push({ text:s, lang:'ur' }));
    const arabic = m[1].trim();
    if(arabic) out.push({ text: arabic, lang:'ar' });
    lastIndex = re.lastIndex;
  }
  const rest = text.slice(lastIndex).trim();
  if(rest) splitUrduSentences(rest).forEach(s => out.push({ text:s, lang:'ur' }));
  return out;
}
function splitUrduSentences(text){
  return text.split(/(?<=۔)\s*/).map(s => s.trim()).filter(s => s.length > 0);
}

function setSpeechText(chunks, audioUrl){
  const raw = Array.isArray(chunks) ? chunks : [chunks];
  currentSpeechChunks = raw.flatMap(c => parseSpeechSegments(c));
  currentAudioUrl = audioUrl || null;
  stopSpeech();
}
function stopSpeech(){
  speechQueueIndex = currentSpeechChunks.length; // آگے سنانا روک دیں
  if(speechWatchdog){ clearTimeout(speechWatchdog); speechWatchdog = null; }
  speechSynthesis.cancel();
  if(ttsAudioEl){ ttsAudioEl.pause(); ttsAudioEl.currentTime = 0; }
  const btn = document.getElementById('tiListenBtn');
  if(btn){ btn.classList.remove('active'); btn.innerHTML='🔊 سنیں'; }
}
function toggleListen(){
  const btn = document.getElementById('tiListenBtn');
  const audioPlaying = ttsAudioEl && !ttsAudioEl.paused;
  if(audioPlaying || speechSynthesis.speaking){ stopSpeech(); return; }

  if(currentAudioUrl && ttsAudioEl){
    ttsAudioEl.src = currentAudioUrl;
    ttsAudioEl.onended = ()=>{ if(btn){ btn.classList.remove('active'); btn.innerHTML='🔊 سنیں'; } };
    ttsAudioEl.onerror = ()=>{ playTTSFallback(btn); };
    const playPromise = ttsAudioEl.play();
    if(playPromise){
      playPromise.then(()=>{ if(btn){ btn.classList.add('active'); btn.innerHTML='⏹️ روکیں'; } })
                 .catch(()=>{ playTTSFallback(btn); });
    }
    return;
  }
  playTTSFallback(btn);
}
function speakNextChunk(btn){
  if(speechWatchdog){ clearTimeout(speechWatchdog); speechWatchdog = null; }
  if(speechQueueIndex >= currentSpeechChunks.length){
    if(btn){ btn.classList.remove('active'); btn.innerHTML='🔊 سنیں'; }
    return;
  }
  const chunk = currentSpeechChunks[speechQueueIndex];
  speechQueueIndex++;
  const u = new SpeechSynthesisUtterance(chunk.text);
  if(chunk.lang === 'ar'){
    if(!arabicVoice) arabicVoice = pickArabicVoice(speechSynthesis.getVoices());
    if(arabicVoice) u.voice = arabicVoice;
    u.lang = 'ar-SA';
    u.pitch = 0.85;
    u.rate = 0.72; // عربی تلاوت جیسا ٹھہراؤ
    u.volume = 1;
  }else{
    applyVoiceSettings(u);
  }
  const advance = ()=>{
    if(speechWatchdog){ clearTimeout(speechWatchdog); speechWatchdog = null; }
    speakNextChunk(btn);
  };
  u.onend = advance;
  u.onerror = advance;
  speechSynthesis.speak(u);
  // اگر کسی وجہ سے onend نہ چلے تو خودکار طور پر اگلے حصے پر منتقل ہو جائیں
  const estMs = Math.max(3000, chunk.text.length * 140);
  speechWatchdog = setTimeout(advance, estMs);
}
function playTTSFallback(btn){
  if(!currentSpeechChunks.length) return;
  speechQueueIndex = 0;
  speechSynthesis.cancel();
  speakNextChunk(btn);
  if(btn){ btn.classList.add('active'); btn.innerHTML='⏹️ روکیں'; }
}

function openNamazPopup(key){
  const data = namazData[key];
  if(!data) return;
  if(data.type === 'amal'){
    renderAmal(key, data);
  }else{
    renderRakatList(key, data);
  }
  tiOverlay.classList.add('active');
}

function renderHadithBlock(h){
  if(!h) return '';
  let html = '';
  if(h.arabic){
    html += `<div class="ti-hadith${h.verified ? '' : ' unverified'}">
      <div class="ar">${h.arabic}</div>
      <div class="tr">${h.urdu}</div>
      <div class="ref">${h.verified ? '✓ ' : '⚠ '}${h.ref}</div>
    </div>`;
  }
  if(h.fiqhNote){
    html += `<div class="ti-fiqh-note">${h.unverified ? '⚠ ' : ''}${h.fiqhNote}</div>`;
  }
  return html;
}

function renderRakatList(key, data){
  tiModalTitle.textContent = data.title;
  let html = '';
  if(data.fazeelat){
    html += `<div class="ti-step-title">فضیلت</div>`;
    html += renderHadithBlock(data.fazeelat);
  }
  html += `<div class="ti-rakat-list">`;
  data.rakats.forEach((r, idx) => {
    html += `<div class="ti-rakat-item" data-idx="${idx}">
      <div class="row2"><span class="label">${r.label}</span><span class="count">${r.count}</span></div>
      <div class="note">${r.note}</div>
      ${renderHadithBlock(r.hadith)}
    </div>`;
  });
  html += `</div><div class="ti-disclaimer">یہ ترتیب فقہ حنفی کے مطابق ہے۔ ✓ = تصدیق شدہ حدیث حوالہ۔ ⚠ = عمومی فقہی نوٹ یا غیر مصدقہ حوالہ، جس کی مزید تصدیق ضروری ہے۔ کسی بھی رکعت پر کلک کر کے پڑھنے کا مکمل طریقہ دیکھیں۔</div>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelectorAll('.ti-rakat-item').forEach(item => {
    item.addEventListener('click', () => renderMethod(key, data, parseInt(item.dataset.idx)));
  });

  let speechChunks = [`${data.title}۔`];
  if(data.fazeelat && data.fazeelat.urdu){
    if(data.fazeelat.arabic) speechChunks.push(`فضیلت: «${data.fazeelat.arabic}» — (ترجمہ: ${data.fazeelat.urdu})۔`);
    else speechChunks.push(`فضیلت: ${data.fazeelat.urdu}۔`);
  }
  data.rakats.forEach(r => { speechChunks.push(`${r.label}, ${r.count}۔ ${r.note}۔`); });
  setSpeechText(speechChunks, data.audio);
}

function renderMethod(key, data, idx){
  const rakatInfo = data.rakats[idx];
  const steps = getMethodSteps(rakatInfo);
  tiModalTitle.textContent = `${data.title} — ${rakatInfo.label}`;
  let html = `<button class="ti-back-btn">&#8594; واپس تفصیل دیکھیں</button>`;
  html += renderHadithBlock(rakatInfo.hadith);
  html += `<div class="ti-step-title">${rakatInfo.label} (${rakatInfo.count}) پڑھنے کا طریقہ</div>`;
  html += `<ol class="ti-steps">`;
  steps.forEach(s => html += `<li>${s}</li>`);
  html += `</ol>`;
  if(data.dua){
    html += `<div class="ti-step-title">دعا</div>`;
    html += renderHadithBlock(data.dua);
  }
  html += `<div class="ti-disclaimer">نوٹ: یہ عمومی مسنون طریقہ ہے۔ تفصیلی احادیث اور مکمل حوالہ جات کے لیے مستند فقہی کتب یا اپنے مقامی عالم سے رجوع کریں۔</div>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelector('.ti-back-btn').addEventListener('click', () => renderRakatList(key, data));

  let speechChunks = [`${data.title}, ${rakatInfo.label}۔`];
  if(rakatInfo.hadith && rakatInfo.hadith.urdu){
    if(rakatInfo.hadith.arabic) speechChunks.push(`«${rakatInfo.hadith.arabic}» — (ترجمہ: ${rakatInfo.hadith.urdu})۔`);
    else speechChunks.push(`${rakatInfo.hadith.urdu}۔`);
  }
  speechChunks.push(`اب پڑھنے کا مکمل طریقہ قدم بہ قدم سنیں۔`);
  steps.forEach((s,i) => { speechChunks.push(`مرحلہ ${i+1}: ${s}۔`); });
  if(data.dua && data.dua.urdu){
    if(data.dua.arabic) speechChunks.push(`دعا: «${data.dua.arabic}» — (ترجمہ: ${data.dua.urdu})۔`);
    else speechChunks.push(`دعا: ${data.dua.urdu}۔`);
  }
  setSpeechText(speechChunks, data.audio);
}

function renderAmal(key, data){
  tiModalTitle.textContent = data.title;
  let html = '';
  if(data.fazeelat){
    html += `<div class="ti-step-title">فضیلت</div>`;
    html += renderHadithBlock(data.fazeelat);
  }
  html += `<div class="ti-step-title">طریقہ</div>`;
  html += `<ol class="ti-steps">`;
  data.steps.forEach(s => html += `<li>${s}</li>`);
  html += `</ol>`;
  if(data.dua){
    html += `<div class="ti-step-title">دعا</div>`;
    html += renderHadithBlock(data.dua);
  }
  html += `<div class="ti-disclaimer">✓ = تصدیق شدہ حدیث حوالہ۔ ⚠ = غیر مصدقہ یا کمزور حوالہ، براہ کرم Islam360 یا sunnah.com سے مزید تصدیق کریں۔ مکمل تفصیل کے لیے مستند کتب یا اپنے مقامی عالم سے رجوع کریں۔</div>`;
  tiModalBody.innerHTML = html;

  let speechChunks = [`${data.title}۔`];
  if(data.fazeelat && data.fazeelat.urdu){
    if(data.fazeelat.arabic) speechChunks.push(`فضیلت: «${data.fazeelat.arabic}» — (ترجمہ: ${data.fazeelat.urdu})۔`);
    else speechChunks.push(`فضیلت: ${data.fazeelat.urdu}۔`);
  }
  speechChunks.push(`طریقہ سنیں۔`);
  data.steps.forEach((s,i) => { speechChunks.push(`مرحلہ ${i+1}: ${s}۔`); });
  if(data.dua && data.dua.urdu){
    if(data.dua.arabic) speechChunks.push(`دعا: «${data.dua.arabic}» — (ترجمہ: ${data.dua.urdu})۔`);
    else speechChunks.push(`دعا: ${data.dua.urdu}۔`);
  }
  setSpeechText(speechChunks, data.audio);
}
