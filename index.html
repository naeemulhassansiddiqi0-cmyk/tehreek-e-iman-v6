<script>
const to12=x=>{const[h,m]=x.split(':');const H=+h;return`${H%12||12}:${m} ${H>=12?'PM':'AM'}`};
const addMins=(time,mins)=>{let[h,m]=time.split(':').map(Number);let d=new Date();d.setHours(h,m+mins);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const timeToMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const minToTime=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=Math.round(m%60);return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`};

function computeTahajjud(ishaTime,fajrTime){
  let isha=timeToMin(ishaTime), fajr=timeToMin(fajrTime);
  if(fajr<=isha) fajr+=1440;
  const duration=fajr-isha;
  const lastThirdStart=fajr-duration/3;
  return minToTime(lastThirdStart);
}

let allTimes=[];
let nextPrayerCache=null;
const azan=document.getElementById('azanAudio');
let isAzanPlaying=false;

Notification.requestPermission();

function playAzan(btn){
  if(isAzanPlaying){
    azan.pause();
    azan.currentTime=0;
    btn.classList.remove('active');
    btn.innerHTML='🔈 اذان';
    isAzanPlaying=false;
  }else{
    azan.currentTime=0; 
    azan.play().then(()=>{
      btn.classList.add('active');
      btn.innerHTML='⏹️ بند کریں';
      isAzanPlaying=true;
    }).catch(e=>alert('پہلے اسکرین کو 1 بار Touch کریں پھر اذان دبائیں'));
  }
  azan.onended=()=>{
    document.querySelectorAll('.azan-btn').forEach(b=>{
      b.classList.remove('active');
      b.innerHTML='🔈 اذان';
    });
    isAzanPlaying=false;
  }
}

function checkAlarms(){
  const now=new Date();
  const current=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  allTimes.forEach(t=>{
    if(t.time===current && !t.rang){
      const btn=document.querySelector('.azan-btn');
      if(btn) playAzan(btn);
      t.rang=true;
    }
  });
}

function setAlarm(name,time){
  if(Notification.permission!=='granted'){Notification.requestPermission();}
  const [h,m]=time.split(':');
  const alarmTime=new Date();
  alarmTime.setHours(+h,m,0,0);
  if(alarmTime<new Date())alarmTime.setDate(alarmTime.getDate()+1);
  const diff=alarmTime-new Date();
  setTimeout(()=>{ const btn=document.querySelector('.azan-btn'); if(btn) playAzan(btn);},diff);
  alert(`${name} کا Alarm ${to12(time)} پر سیٹ ہو گیا`);
}

function getNextPrayerTarget(){
  const mainNames=['فجر','ظہر','عصر','مغرب','عشاء'];
  const mainPrayers=allTimes.filter(t=>mainNames.includes(t.name));
  if(!mainPrayers.length) return null;
  const pktNow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
  let best=null;
  mainPrayers.forEach(t=>{
    const [h,m]=t.time.split(':').map(Number);
    let target=new Date(pktNow);
    target.setHours(h,m,0,0);
    if(target<=pktNow) target.setDate(target.getDate()+1);
    if(!best || target<best.target) best={target,name:t.name};
  });
  return best;
}

function updateClockAndCountdown(){
  const pktStr=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Karachi',hour12:true,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const clockEl=document.getElementById('liveClock');
  if(clockEl) clockEl.textContent=pktStr+' PST';

  const labelEl=document.getElementById('countdownLabel');
  const timerEl=document.getElementById('countdownTimer');
  if(!nextPrayerCache){ if(timerEl) timerEl.textContent='--:--:--'; return; }

  const pktNow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
  let diff=nextPrayerCache.target-pktNow;
  if(diff<=0){ nextPrayerCache=getNextPrayerTarget(); if(!nextPrayerCache){ if(timerEl) timerEl.textContent='--:--:--'; return;} diff=nextPrayerCache.target-pktNow; }

  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if(labelEl) labelEl.textContent=`${nextPrayerCache.name} میں`;
  if(timerEl) timerEl.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

    `ثناء پڑھیں: ${fmt(ARB.sana)}`,
    `تعوذ اور تسمیہ پڑھیں: ${fmt(ARB.taawuz)} — ${fmt(ARB.tasmia)}`,
    `سورۃ الفاتحہ پڑھیں اور آمین کہیں: ${fmt(ARB.fatiha)}`,
    `کوئی سورت ملائیں، جیسے سورۃ الاخلاص: ${fmt(ARB.ikhlas)}`
  ];
  const rukuSajda = [
    `«${ARB.takbeer.ar}» کہہ کر رکوع میں جائیں (تین بار «${ARB.rukuTasbeeh.ar}»)`,
    `سیدھے کھڑے ہوتے ہوئے کہیں: ${fmt(ARB.samiAllah)}`,
    `سجدے میں جائیں (تین بار «${ARB.sajdaTasbeeh.ar}»)، دو سجدے مکمل کریں — پہلی رکعت مکمل`
  ];
  const secondRakat = [
    `دوسری رکعت کے لیے کھڑے ہوں، تسمیہ، سورۃ الفاتحہ اور سورت پڑھ کر رکوع و سجدہ کریں`
  ];
  const closing = [
    `قعدہ میں تشہد پڑھیں: ${fmt(ARB.tashahhud)}`,
    `درودِ ابراہیمی پڑھیں: ${fmt(ARB.durood)}`,
    `دعا پڑھیں: ${fmt(ARB.duaMasura)} اور دونوں طرف سلام پھیر کر نماز مکمل کریں`
  ];

  if (isWitr) return [
    ...opening, ...rukuSajda, ...secondRakat,
    `دوسری رکعت کے بعد بیٹھ کر صرف تشہد پڑھیں، پھر تیسری رکعت کے لیے کھڑے ہوں`,
    `تیسری رکعت میں سورۃ کے بعد تکبیر کہہ کر ہاتھ باندھیں اور دعائے قنوت پڑھیں: ${fmt(ARB.quNoot)}`,
    `رکوع و سجود کر کے قعدہ میں سلام پھیر دیں`
  ];

  if (rakatCount >= 4) return [
    ...opening, ...rukuSajda, ...secondRakat,
    `دوسری رکعت کے بعد قعدہ اولیٰ میں صرف تشہد پڑھیں، پھر تیسری رکعت کے لیے کھڑے ہوں`,
    `تیسری اور چوتھی رکعت میں سورۃ الفاتحہ پڑھ کر رکوع و سجود کریں`,
    ...closing
  ];

  return [...opening, ...rukuSajda, ...secondRakat, ...closing];
}

const tiOverlay = document.getElementById('tiOverlay');
const tiModalTitle = document.getElementById('tiModalTitle');
const tiModalBody = document.getElementById('tiModalBody');
document.getElementById('tiCloseBtn').addEventListener('click', ()=>tiOverlay.classList.remove('active'));
tiOverlay.addEventListener('click', e=>{ if(e.target===tiOverlay) tiOverlay.classList.remove('active'); });

function openNamazPopup(key){
  const data = namazData[key];
  if(!data) return;
  if(data.type === 'amal'){
    renderAmal(key, data);
  }else{
    renderRakatList(key, data);
  }
  tiOverlay.classList.add('active');
}

function renderHadithBlock(h){
  if(!h) return '';
  let html = '';
  if(h.arabic){
    html += `<div class="ti-hadith${h.verified ? '' : ' unverified'}">
      <div class="ar">${h.arabic}</div>
      <div class="tr">${h.urdu}</div>
      <div class="ref">${h.verified ? '✓ ' : '⚠ '}${h.ref}</div>
    </div>`;
  }
  if(h.fiqhNote){
    html += `<div class="ti-fiqh-note">${h.fiqhNote}</div>`;
  }
  return html;
}

function renderRakatList(key, data){
  tiModalTitle.textContent = data.title;
  let html = '';
  if(data.fazeelat){
    html += `<div class="ti-step-title">فضیلت</div>` + renderHadithBlock(data.fazeelat);
  }
  html += `<div class="ti-rakat-list">`;
  data.rakats.forEach((r, idx) => {
    html += `<div class="ti-rakat-item" data-idx="${idx}">
      <div class="row2"><span class="label">${r.label}</span><span class="count">${r.count}</span></div>
      <div class="note">${r.note}</div>
      ${renderHadithBlock(r.hadith)}
    </div>`;
  });
  html += `</div><div class="ti-disclaimer">کسی بھی رکعت پر کلک کر کے پڑھنے کا مسنون طریقہ دیکھیں۔</div>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelectorAll('.ti-rakat-item').forEach(item => {
    item.addEventListener('click', () => renderMethod(key, data, parseInt(item.dataset.idx)));
  });
}

function renderMethod(key, data, idx){
  const rakatInfo = data.rakats[idx];
  const steps = getMethodSteps(rakatInfo);
  tiModalTitle.textContent = `${data.title} — ${rakatInfo.label}`;
  let html = `<button class="ti-back-btn">&#8594; واپس تفصیل دیکھیں</button>`;
  html += renderHadithBlock(rakatInfo.hadith);
  html += `<div class="ti-step-title">${rakatInfo.label} (${rakatInfo.count}) کا طریقہ</div><ol class="ti-steps">`;
  steps.forEach(s => html += `<li>${s}</li>`);
  html += `</ol>`;
  tiModalBody.innerHTML = html;
  tiModalBody.querySelector('.ti-back-btn').addEventListener('click', () => renderRakatList(key, data));
}

function renderAmal(key, data){
  tiModalTitle.textContent = data.title;
  let html = '';
  if(data.fazeelat) html += `<div class="ti-step-title">فضیلت</div>` + renderHadithBlock(data.fazeelat);
  html += `<div class="ti-step-title">طریقہ</div><ol class="ti-steps">`;
  data.steps.forEach(s => html += `<li>${s}</li>`);
  html += `</ol>`;
  if(data.dua) html += `<div class="ti-step-title">دعا</div>` + renderHadithBlock(data.dua);
  tiModalBody.innerHTML = html;
}

function renderTimes(){
  let html='';
  allTimes.forEach(t=>{
    const namazKey = namazKeyMap[t.name];
    const nameClass = namazKey ? 'name clickable' : 'name';
    const nameAttr = namazKey ? `onclick="openNamazPopup('${namazKey}')"` : '';
    html+=`<div class="box">
      <span class="${nameClass} ${t.custom?'custom':''}" ${nameAttr}>${t.name}</span>
      <span class="time">${to12(t.time)}</span>
      <div class="btns">
        <button class="azan-btn" onclick="playAzan(this)">🔈 اذان</button>
        <button class="alarm-btn" onclick="setAlarm('${t.name}','${t.time}')">Alarm</button>
      </div>
    </div>`;
  });
  document.getElementById('times').innerHTML=html;
}

function addCustom(){
  const name=document.getElementById('customName').value;
  const time=document.getElementById('customTime').value;
  if(!name||!time){alert('نام اور ٹائم لکھیں');return;}
  allTimes.push({name,time,custom:true,rang:false});
  renderTimes();
  document.getElementById('customName').value='';
  document.getElementById('customTime').value='';
}

function showTimings(city){
  fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Pakistan&method=1`)
  .then(r=>r.json()).then(d=>{
    const t=d.data.timings;
    const sunrise=t.Sunrise; const dhuhr=t.Dhuhr; const maghrib=t.Maghrib;
    const ishraq=addMins(sunrise,20); const chasht=addMins(sunrise,45); const zawal=addMins(dhuhr,-10); const awabeen=addMins(maghrib,20);
    const sehri=addMins(t.Fajr,-10); const iftar=maghrib;
    const tahajjud=computeTahajjud(t.Isha,t.Fajr);

    allTimes=[
      {name:'فجر',time:t.Fajr,rang:false},
      {name:'ظہر',time:dhuhr,rang:false},
      {name:'عصر',time:t.Asr,rang:false},
      {name:'مغرب',time:maghrib,rang:false},
      {name:'عشاء',time:t.Isha,rang:false},
      {name:'سحری',time:sehri,rang:false},
      {name:'افطاری',time:iftar,rang:false},
      {name:'طلوع آفتاب',time:sunrise,rang:false},
      {name:'غروب آفتاب',time:maghrib,rang:false},
      {name:'اشراق',time:ishraq,rang:false},
      {name:'چاشت',time:chasht,rang:false},
      {name:'زوال',time:zawal,rang:false},
      {name:'اوابین',time:awabeen,rang:false},
      {name:'تہجد',time:tahajjud,rang:false}
    ];
    renderTimes();
    nextPrayerCache=getNextPrayerTarget();
  });
}

document.getElementById('citySelect').addEventListener('change',e=>showTimings(e.target.value));
showTimings('Karachi');
setInterval(checkAlarms,60000);
setInterval(updateClockAndCountdown,1000);
updateClockAndCountdown();
</script>
